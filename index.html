<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SPECTRA v0.5</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="app">


        <!-- =================================================
             TOP BAR
        ================================================== -->

        <header class="topbar">

            <div>

                <h1>SPECTRA</h1>

                <p>
                    VISION INTERACTION SYSTEM // v0.5
                </p>

            </div>


            <div class="system-status">

                <span id="statusDot"></span>

                <span id="systemStatus">
                    OFFLINE
                </span>

            </div>

        </header>


        <!-- =================================================
             CAMERA
        ================================================== -->

        <section class="camera-wrapper">

            <video
                id="camera"
                autoplay
                playsinline
                muted
            ></video>


            <canvas
                id="overlay"
            ></canvas>


            <div class="scanlines"></div>


            <div id="cameraMessage">
                CAMERA OFF
            </div>


            <!-- TOP LEFT -->

            <div class="hud hud-top-left">

                <div>
                    MODE // VISION
                </div>

                <div id="handState">
                    HAND // NOT DETECTED
                </div>

            </div>


            <!-- TOP RIGHT -->

            <div class="hud hud-top-right">

                <div>
                    TARGET //
                    <span id="targetNumber">
                        00
                    </span>
                </div>

                <div>

                    X:
                    <span id="xValue">
                        ---
                    </span>

                    Y:
                    <span id="yValue">
                        ---
                    </span>

                </div>

            </div>


            <!-- BOTTOM LEFT -->

            <div class="hud hud-bottom-left">

                <div>

                    FPS
                    <span id="fpsValue">
                        00
                    </span>

                </div>


                <div>

                    STATE

                    <span id="trackingState">
                        IDLE
                    </span>

                </div>

            </div>


            <!-- BOTTOM RIGHT -->

            <div class="hud hud-bottom-right">

                <div>
                    SPECTRA
                </div>


                <div id="gestureText">
                    GESTURE // NONE
                </div>

            </div>

        </section>


        <!-- =================================================
             CONTROLS
        ================================================== -->

        <section class="controls">


            <button id="startButton">
                START CAMERA
            </button>


            <button
                id="trackingButton"
                disabled
            >
                HAND TRACKING
            </button>


            <button id="boxButton">
                TARGET BOX ON
            </button>


            <button id="objectButton">
                OBJECT DETECTION OFF
            </button>


            <button id="privacyButton">
                FACE PRIVACY OFF
            </button>


            <button id="signButton">
                SIGN LANGUAGE OFF
            </button>


            <button id="objectModeButton">
                OBJECT MODE ON
            </button>


        </section>


        <!-- =================================================
             INFORMATION PANEL
        ================================================== -->

        <section class="info-panel">


            <div class="info-item">

                <span>
                    HANDS
                </span>

                <strong id="handsValue">
                    0
                </strong>

            </div>


            <div class="info-item">

                <span>
                    INDEX
                </span>

                <strong id="indexValue">
                    ---
                </strong>

            </div>


            <div class="info-item">

                <span>
                    PINCH
                </span>

                <strong id="pinchValue">
                    ---
                </strong>

            </div>


            <div class="info-item">

                <span>
                    GESTURE
                </span>

                <strong id="gestureValue">
                    NONE
                </strong>

            </div>


        </section>


        <p id="status">
            System ready.
        </p>


    </main>


    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
