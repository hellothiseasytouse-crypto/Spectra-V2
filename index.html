<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>SPECTRA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div class="camera-wrapper">

        <video id="camera"
               autoplay
               playsinline
               muted></video>

        <canvas id="overlay"></canvas>

        <div class="hud">

            <div class="top-left">
                <div class="title">SPECTRA</div>
                <div class="mode">MODE // VISION AI</div>
            </div>

            <div class="top-right">
                <div>HAND // <span id="handStatus">WAITING</span></div>
                <div>FACE // <span id="faceStatus">WAITING</span></div>
                <div>FPS // <span id="fps">0</span></div>
            </div>

            <div class="center-info">
                <div class="target-label">SPECTRA VISION</div>
                <div class="crosshair"></div>
            </div>

            <div class="bottom-left">
                <div>GESTURE // <span id="gesture">NONE</span></div>
                <div>SIGN // <span id="sign">NONE</span></div>
                <div>SHAPE // <span id="shapeStatus">READY</span></div>
            </div>

            <div class="bottom-right">
                <div>OBJECTS // <span id="objectStatus">OFF</span></div>
                <div>FILTER // <span id="filterStatus">OFF</span></div>
            </div>

        </div>

    </div>

    <div class="controls">

        <button id="startBtn">START CAMERA</button>

        <button id="trackingBtn">
            HAND TRACKING ON
        </button>

        <button id="targetBtn">
            TARGET BOX ON
        </button>

        <button id="objectBtn">
            OBJECT DETECTION OFF
        </button>

        <button id="privacyBtn">
            FACE PRIVACY OFF
        </button>

        <button id="signBtn">
            SIGN LANGUAGE OFF
        </button>

        <button id="filterBtn">
            FILTER OFF
        </button>

        <button id="shapeBtn">
            SHAPES ON
        </button>

    </div>

    <div class="info-panel">

        <div>
            <span>HANDS</span>
            <strong id="handsInfo">0</strong>
        </div>

        <div>
            <span>FACES</span>
            <strong id="facesInfo">0</strong>
        </div>

        <div>
            <span>GESTURE</span>
            <strong id="gestureInfo">NONE</strong>
        </div>

        <div>
            <span>SIGN</span>
            <strong id="signInfo">NONE</strong>
        </div>

        <div>
            <span>SHAPES</span>
            <strong id="shapesInfo">0</strong>
        </div>

    </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
