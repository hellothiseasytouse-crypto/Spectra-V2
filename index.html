<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SPECTRA v0.3</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="topbar">
            <div>
                <h1>SPECTRA</h1>
                <p>HAND TRACKING SYSTEM // v0.3</p>
            </div>

            <div class="system-status">
                <span id="statusDot"></span>
                <span id="systemStatus">OFFLINE</span>
            </div>
        </header>


        <section class="camera-wrapper">

            <video
                id="camera"
                autoplay
                playsinline
                muted
            ></video>

            <canvas id="overlay"></canvas>

            <div class="scanlines"></div>

            <div id="cameraMessage">
                CAMERA OFF
            </div>


            <!-- Top-left HUD -->

            <div class="hud hud-top-left">

                <div>MODE // HAND TRACK</div>
                <div id="handState">
                    HAND // NOT DETECTED
                </div>

            </div>


            <!-- Top-right HUD -->

            <div class="hud hud-top-right">

                <div>TARGET // <span id="targetNumber">00</span></div>

                <div>
                    X:<span id="xValue">---</span>
                    Y:<span id="yValue">---</span>
                </div>

            </div>


            <!-- Bottom-left HUD -->

            <div class="hud hud-bottom-left">

                <div>FPS <span id="fpsValue">00</span></div>

                <div>
                    STATE
                    <span id="trackingState">
                        IDLE
                    </span>
                </div>

            </div>


            <!-- Bottom-right HUD -->

            <div class="hud hud-bottom-right">

                <div>SPECTRA</div>
                <div id="gestureText">
                    GESTURE // NONE
                </div>

            </div>

        </section>


        <section class="controls">

            <button id="startButton">
                START CAMERA
            </button>

            <button
                id="trackingButton"
                disabled
            >
                HAND TRACKING
            </button>

        </section>


        <section class="info-panel">

            <div class="info-item">
                <span>HANDS</span>
                <strong id="handsValue">0</strong>
            </div>

            <div class="info-item">
                <span>INDEX</span>
                <strong id="indexValue">---</strong>
            </div>

            <div class="info-item">
                <span>PINCH</span>
                <strong id="pinchValue">---</strong>
            </div>

            <div class="info-item">
                <span>GESTURE</span>
                <strong id="gestureValue">NONE</strong>
            </div>

        </section>


        <p id="status">
            System ready.
        </p>

    </main>


    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
